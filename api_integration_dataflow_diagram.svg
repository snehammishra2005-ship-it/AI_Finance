<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" style="color:#1f2937" role="img" aria-label="API integration data flow diagram">
  <title>API Integration — Data Flow Diagram</title>
  <defs>
    <marker id="df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
    <style>
      .lbl{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:600;}
      .sub{fill:currentColor;fill-opacity:.6;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;}
      .hdr{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:700;}
      .flow{stroke:currentColor;stroke-opacity:.4;fill:none;}
      .req{fill:currentColor;fill-opacity:.72;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-size:8.5px;}
      .rsp{fill:currentColor;fill-opacity:.5;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-size:8.5px;font-style:italic;}
      .entity{fill:none;stroke:#2563eb;stroke-opacity:.8;}
      .proc{fill:none;stroke:currentColor;stroke-opacity:.35;}
      .store{stroke:#1e8449;stroke-opacity:.8;}
      .stlbl{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:600;}
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" class="hdr">API Integration — Data Flow Diagram</text>

  <!-- nodes (y-centered ~205) -->
  <rect class="entity" x="24" y="176" width="118" height="60" rx="4"/>
  <text x="83" y="200" text-anchor="middle" font-size="11" class="lbl">User /</text>
  <text x="83" y="216" text-anchor="middle" font-size="11" class="lbl">Chat UI</text>

  <rect class="proc" x="196" y="180" width="120" height="52" rx="14"/>
  <text x="256" y="203" text-anchor="middle" font-size="11" class="lbl">/chat</text>
  <text x="256" y="218" text-anchor="middle" font-size="9" class="sub">endpoint</text>

  <rect class="proc" x="386" y="172" width="150" height="68" rx="14"/>
  <text x="461" y="200" text-anchor="middle" font-size="11.5" class="lbl">LLMEngine</text>
  <text x="461" y="216" text-anchor="middle" font-size="9" class="sub">router · fallback</text>

  <rect class="proc" x="606" y="180" width="120" height="52" rx="14"/>
  <text x="666" y="203" text-anchor="middle" font-size="11" class="lbl">Provider</text>
  <text x="666" y="218" text-anchor="middle" font-size="9" class="sub">adapter</text>

  <rect class="entity" x="792" y="160" width="146" height="92" rx="4"/>
  <text x="865" y="182" text-anchor="middle" font-size="10.5" class="lbl">LLM provider</text>
  <text x="865" y="196" text-anchor="middle" font-size="10.5" class="lbl">APIs</text>
  <text x="865" y="212" text-anchor="middle" font-size="8" class="sub">Groq · OpenRouter</text>
  <text x="865" y="223" text-anchor="middle" font-size="8" class="sub">Gemini · Anthropic</text>
  <text x="865" y="234" text-anchor="middle" font-size="8" class="sub">Cerebras · Mistral</text>

  <!-- horizontal flows (bidirectional) with req (top) / resp (bottom) labels -->
  <line class="flow" x1="142" y1="206" x2="196" y2="206" marker-start="url(#df)" marker-end="url(#df)"/>
  <text x="169" y="196" text-anchor="middle" class="req">message,</text>
  <text x="169" y="222" text-anchor="middle" class="rsp">response</text>

  <line class="flow" x1="316" y1="206" x2="386" y2="206" marker-start="url(#df)" marker-end="url(#df)"/>
  <text x="351" y="196" text-anchor="middle" class="req">model, tokens</text>
  <text x="351" y="222" text-anchor="middle" class="rsp">answer + model</text>

  <line class="flow" x1="536" y1="206" x2="606" y2="206" marker-start="url(#df)" marker-end="url(#df)"/>
  <text x="571" y="196" text-anchor="middle" class="req">prompt</text>
  <text x="571" y="222" text-anchor="middle" class="rsp">text / error</text>

  <line class="flow" x1="726" y1="206" x2="792" y2="206" marker-start="url(#df)" marker-end="url(#df)"/>
  <text x="759" y="196" text-anchor="middle" class="req">API call</text>
  <text x="759" y="222" text-anchor="middle" class="rsp">completion</text>

  <!-- data stores (open-ended, below the router) -->
  <g>
    <line class="store" x1="300" y1="330" x2="422" y2="330"/>
    <line class="store" x1="300" y1="368" x2="422" y2="368"/>
    <line class="store" x1="300" y1="330" x2="300" y2="368"/>
    <text x="361" y="347" text-anchor="middle" font-size="10" class="stlbl">SLM_LIST</text>
    <text x="361" y="360" text-anchor="middle" font-size="8" class="sub">model catalog</text>

    <line class="store" x1="440" y1="330" x2="562" y2="330"/>
    <line class="store" x1="440" y1="368" x2="562" y2="368"/>
    <line class="store" x1="440" y1="330" x2="440" y2="368"/>
    <text x="501" y="347" text-anchor="middle" font-size="10" class="stlbl">.env keys</text>
    <text x="501" y="360" text-anchor="middle" font-size="8" class="sub">PROVIDER_ENV</text>

    <line class="store" x1="580" y1="330" x2="702" y2="330"/>
    <line class="store" x1="580" y1="368" x2="702" y2="368"/>
    <line class="store" x1="580" y1="330" x2="580" y2="368"/>
    <text x="641" y="347" text-anchor="middle" font-size="10" class="stlbl">Provider cache</text>
    <text x="641" y="360" text-anchor="middle" font-size="8" class="sub">by provider+model</text>
  </g>

  <!-- store -> router flows -->
  <line class="flow" x1="361" y1="330" x2="430" y2="240" marker-end="url(#df)"/>
  <text x="378" y="300" class="req">provider, model_id</text>
  <line class="flow" x1="501" y1="330" x2="470" y2="240" marker-end="url(#df)"/>
  <text x="508" y="300" class="req">API key</text>
  <line class="flow" x1="641" y1="330" x2="510" y2="240" marker-start="url(#df)" marker-end="url(#df)"/>
  <text x="600" y="285" class="req">cached client</text>

  <!-- legend -->
  <g font-size="10" class="sub">
    <rect class="entity" x="40" y="410" width="16" height="12" rx="2"/>
    <text x="62" y="420">external entity</text>
    <rect class="proc" x="180" y="410" width="16" height="12" rx="6"/>
    <text x="202" y="420">process</text>
    <line class="store" x1="290" y1="410" x2="306" y2="410"/>
    <line class="store" x1="290" y1="422" x2="306" y2="422"/>
    <line class="store" x1="290" y1="410" x2="290" y2="422"/>
    <text x="312" y="420">data store</text>
  </g>
</svg>
