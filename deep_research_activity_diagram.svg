<svg viewBox="0 0 700 720" xmlns="http://www.w3.org/2000/svg" style="color:#1f2937" role="img" aria-label="Deep Research activity diagram">
  <title>Deep Research in Q&amp;A — Activity Diagram</title>
  <defs>
    <marker id="rv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
    <style>
      .box{fill:none;stroke:currentColor;stroke-opacity:.3;}
      .lbl{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:600;}
      .sub{fill:currentColor;fill-opacity:.6;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;}
      .hdr{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:700;}
      .flow{stroke:currentColor;stroke-opacity:.4;fill:none;}
      .term{stroke:#1e8449;}
      .dec{stroke:#b7791f;}
      .err{stroke:#c0392b;}
      .elab{fill:currentColor;fill-opacity:.6;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-size:10px;}
    </style>
  </defs>
  <rect x="0" y="0" width="700" height="720" fill="#ffffff"/>
  <text x="330" y="26" text-anchor="middle" font-size="16" class="hdr">Deep Research in Q&amp;A — Activity Diagram</text>

  <rect class="box term" x="205" y="42" width="250" height="30" rx="15"/>
  <text x="330" y="62" text-anchor="middle" font-size="11.5" class="lbl">Question · web toggle on</text>
  <line class="flow" x1="330" y1="72" x2="330" y2="88" marker-end="url(#rv)"/>

  <!-- any provider usable? -->
  <polygon class="box dec" points="330,88 460,126 330,164 200,126"/>
  <text x="330" y="122" text-anchor="middle" font-size="10.5" class="lbl">Any provider</text>
  <text x="330" y="135" text-anchor="middle" font-size="10.5" class="lbl">usable?</text>
  <line class="flow" x1="460" y1="126" x2="540" y2="126" marker-end="url(#rv)"/>
  <text x="470" y="120" class="elab">No</text>
  <rect class="box err" x="540" y="108" width="130" height="36" rx="18"/>
  <text x="605" y="130" text-anchor="middle" font-size="10.5" class="lbl">HTTP 502</text>
  <line class="flow" x1="330" y1="164" x2="330" y2="182" marker-end="url(#rv)"/>
  <text x="342" y="180" class="elab">Yes</text>

  <!-- use documents? -->
  <polygon class="box dec" points="330,182 450,220 330,258 210,220"/>
  <text x="330" y="224" text-anchor="middle" font-size="10.5" class="lbl">Use documents?</text>
  <line class="flow" x1="210" y1="220" x2="120" y2="220" marker-end="url(#rv)"/>
  <text x="150" y="214" class="elab">Yes</text>
  <rect class="box" x="20" y="200" width="100" height="40" rx="7"/>
  <text x="70" y="218" text-anchor="middle" font-size="9.5" class="lbl">get_context</text>
  <text x="70" y="230" text-anchor="middle" font-size="8" class="sub">doc context</text>
  <line class="flow" x1="330" y1="258" x2="330" y2="276" marker-end="url(#rv)"/>
  <text x="342" y="274" class="elab">No</text>
  <!-- get_context rejoins -->
  <path class="flow" d="M70 240 L70 296 L200 296" marker-end="url(#rv)"/>

  <!-- web search -->
  <rect class="box" x="180" y="276" width="300" height="42" rx="7"/>
  <text x="330" y="294" text-anchor="middle" font-size="11" class="lbl">Web search (Tavily)</text>
  <text x="330" y="307" text-anchor="middle" font-size="8.5" class="sub">recency · domain trust · cache</text>
  <line class="flow" x1="330" y1="318" x2="330" y2="336" marker-end="url(#rv)"/>

  <!-- results? -->
  <polygon class="box dec" points="330,336 450,374 330,412 210,374"/>
  <text x="330" y="378" text-anchor="middle" font-size="10.5" class="lbl">Results found?</text>
  <line class="flow" x1="450" y1="374" x2="530" y2="374" marker-end="url(#rv)"/>
  <text x="460" y="368" class="elab">No</text>
  <rect class="box" x="530" y="356" width="150" height="38" rx="7"/>
  <text x="605" y="373" text-anchor="middle" font-size="9.5" class="lbl">web_note</text>
  <text x="605" y="385" text-anchor="middle" font-size="8" class="sub">answer without web</text>
  <line class="flow" x1="330" y1="412" x2="330" y2="430" marker-end="url(#rv)"/>
  <text x="342" y="428" class="elab">Yes</text>

  <!-- iterative follow-up -->
  <rect class="box" x="180" y="430" width="300" height="42" rx="7"/>
  <text x="330" y="448" text-anchor="middle" font-size="11" class="lbl">One follow-up query · merge</text>
  <text x="330" y="461" text-anchor="middle" font-size="8.5" class="sub">iterative search (max 2)</text>
  <line class="flow" x1="330" y1="472" x2="330" y2="490" marker-end="url(#rv)"/>

  <!-- build prompt -->
  <rect class="box" x="180" y="490" width="300" height="42" rx="7"/>
  <text x="330" y="508" text-anchor="middle" font-size="11" class="lbl">Build prompt · blend or web</text>
  <text x="330" y="521" text-anchor="middle" font-size="8.5" class="sub">numbered sources</text>
  <!-- web_note rejoins into build/synthesize -->
  <path class="flow" d="M605 394 L605 511 L480 511" marker-end="url(#rv)"/>
  <line class="flow" x1="330" y1="532" x2="330" y2="550" marker-end="url(#rv)"/>

  <!-- synthesize -->
  <rect class="box" x="180" y="550" width="300" height="42" rx="7"/>
  <text x="330" y="568" text-anchor="middle" font-size="11" class="lbl">Synthesize · 1024 tokens</text>
  <text x="330" y="581" text-anchor="middle" font-size="8.5" class="sub">provider fallback</text>
  <line class="flow" x1="330" y1="592" x2="330" y2="610" marker-end="url(#rv)"/>

  <rect class="box" x="200" y="610" width="260" height="32" rx="7"/>
  <text x="330" y="630" text-anchor="middle" font-size="10.5" class="lbl">Strip invalid citations</text>
  <line class="flow" x1="330" y1="642" x2="330" y2="658" marker-end="url(#rv)"/>

  <rect class="box term" x="200" y="658" width="260" height="34" rx="17"/>
  <text x="330" y="679" text-anchor="middle" font-size="11" class="lbl">✓ Cited answer + sources</text>

  <g font-size="10" class="sub">
    <rect class="box term" x="30" y="660" width="15" height="11" rx="5"/>
    <text x="50" y="669">terminal</text>
    <rect class="box dec" x="30" y="678" width="15" height="11"/>
    <text x="50" y="687">decision</text>
    <rect class="box err" x="120" y="660" width="15" height="11" rx="3"/>
    <text x="140" y="669">error</text>
  </g>
</svg>
