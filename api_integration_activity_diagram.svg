<svg viewBox="0 0 640 720" xmlns="http://www.w3.org/2000/svg" style="color:#1f2937" role="img" aria-label="API integration activity diagram">
  <title>API Integration — Activity Diagram</title>
  <defs>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
    <style>
      .box{fill:none;stroke:currentColor;stroke-opacity:.3;}
      .lbl{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:600;}
      .sub{fill:currentColor;fill-opacity:.6;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;}
      .hdr{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:700;}
      .flow{stroke:currentColor;stroke-opacity:.4;fill:none;}
      .term{stroke:#1e8449;}
      .dec{stroke:#b7791f;}
      .err{stroke:#c0392b;}
      .elab{fill:currentColor;fill-opacity:.6;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-size:10px;}
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="720" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" class="hdr">API Integration — Activity Diagram</text>

  <!-- start -->
  <rect class="box term" x="200" y="46" width="240" height="34" rx="17"/>
  <text x="320" y="67" text-anchor="middle" font-size="11.5" class="lbl">Request · message, model, persona</text>
  <line class="flow" x1="320" y1="80" x2="320" y2="96" marker-end="url(#av)"/>

  <!-- build order -->
  <rect class="box" x="150" y="96" width="340" height="44" rx="7"/>
  <text x="320" y="114" text-anchor="middle" font-size="11.5" class="lbl">Build fallback order</text>
  <text x="320" y="130" text-anchor="middle" font-size="9" class="sub">requested model + other configured providers</text>
  <line class="flow" x1="320" y1="140" x2="320" y2="156" marker-end="url(#av)"/>

  <!-- pick next (loop target) -->
  <rect class="box" x="210" y="156" width="220" height="32" rx="7"/>
  <text x="320" y="176" text-anchor="middle" font-size="11.5" class="lbl">Pick next candidate</text>
  <line class="flow" x1="320" y1="188" x2="320" y2="206" marker-end="url(#av)"/>

  <!-- decision: init? -->
  <polygon class="box dec" points="320,206 470,258 320,310 170,258"/>
  <text x="320" y="252" text-anchor="middle" font-size="11" class="lbl">Provider</text>
  <text x="320" y="266" text-anchor="middle" font-size="11" class="lbl">initializes?</text>
  <line class="flow" x1="320" y1="310" x2="320" y2="330" marker-end="url(#av)"/>
  <text x="332" y="326" class="elab">Yes</text>

  <!-- call api -->
  <rect class="box" x="180" y="330" width="280" height="44" rx="7"/>
  <text x="320" y="348" text-anchor="middle" font-size="11.5" class="lbl">Call provider API</text>
  <text x="320" y="364" text-anchor="middle" font-size="9" class="sub">max_tokens · 60s timeout</text>
  <line class="flow" x1="320" y1="374" x2="320" y2="394" marker-end="url(#av)"/>

  <!-- decision: success? -->
  <polygon class="box dec" points="320,394 460,442 320,490 180,442"/>
  <text x="320" y="440" text-anchor="middle" font-size="11" class="lbl">Call</text>
  <text x="320" y="454" text-anchor="middle" font-size="11" class="lbl">succeeded?</text>

  <!-- success -> end -->
  <line class="flow" x1="320" y1="490" x2="320" y2="512" marker-end="url(#av)"/>
  <text x="332" y="508" class="elab">Yes</text>
  <rect class="box term" x="170" y="512" width="300" height="36" rx="18"/>
  <text x="320" y="530" text-anchor="middle" font-size="11.5" class="lbl">✓ Return answer + model used</text>

  <!-- failure paths to 'record error' (right side) -->
  <rect class="box err" x="500" y="330" width="120" height="40" rx="7"/>
  <text x="560" y="354" text-anchor="middle" font-size="11" class="lbl">Record error</text>

  <!-- init No -> record error -->
  <line class="flow" x1="470" y1="258" x2="560" y2="258" marker-end="url(#av)"/>
  <line class="flow" x1="560" y1="258" x2="560" y2="330" marker-end="url(#av)"/>
  <text x="478" y="252" class="elab">No</text>

  <!-- success No -> record error -->
  <line class="flow" x1="460" y1="442" x2="560" y2="442" marker-end="url(#av)"/>
  <line class="flow" x1="560" y1="442" x2="560" y2="370" marker-end="url(#av)"/>
  <text x="468" y="436" class="elab">No</text>

  <!-- record error -> more candidates? -->
  <line class="flow" x1="560" y1="330" x2="560" y2="300"/>
  <polygon class="box dec" points="560,590 620,620 560,650 500,620"/>
  <text x="560" y="618" text-anchor="middle" font-size="9.5" class="lbl">More</text>
  <text x="560" y="630" text-anchor="middle" font-size="9.5" class="lbl">candidates?</text>
  <path class="flow" d="M560 370 L560 590" marker-end="url(#av)"/>

  <!-- more? Yes -> loop back to pick next -->
  <path class="flow" d="M500 620 L120 620 L120 172 L210 172" marker-end="url(#av)"/>
  <text x="300" y="614" class="elab">Yes — loop</text>

  <!-- more? No -> raise 502 -->
  <line class="flow" x1="560" y1="650" x2="560" y2="668" marker-end="url(#av)"/>
  <text x="572" y="664" class="elab">No</text>
  <rect class="box err" x="420" y="668" width="200" height="38" rx="19"/>
  <text x="520" y="686" text-anchor="middle" font-size="10.5" class="lbl">Raise error → HTTP 502</text>
  <text x="520" y="699" text-anchor="middle" font-size="8.5" class="sub">all providers failed</text>

  <!-- legend -->
  <g font-size="10" class="sub">
    <rect class="box term" x="40" y="676" width="15" height="11" rx="5"/>
    <text x="60" y="685">terminal</text>
    <rect class="box dec" x="130" y="676" width="15" height="11"/>
    <text x="150" y="685">decision</text>
    <rect class="box err" x="220" y="676" width="15" height="11" rx="3"/>
    <text x="240" y="685">failure</text>
  </g>
</svg>
