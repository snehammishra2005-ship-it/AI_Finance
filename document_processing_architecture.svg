<svg viewBox="0 0 920 760" xmlns="http://www.w3.org/2000/svg" style="color:#1f2937" role="img" aria-label="Document processing data architecture">
  <title>Document Processing — Data Architecture</title>
  <desc>Vertical data-flow diagram from file upload to RAG-backed consumers.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
    <style>
      .box{fill:none;stroke:currentColor;stroke-opacity:.28;}
      .lbl{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:600;}
      .sub{fill:currentColor;fill-opacity:.62;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:400;}
      .hdr{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:700;}
      .flow{stroke:currentColor;stroke-opacity:.35;fill:none;}
      .accent{stroke:#3b82f6;}
      .guard{stroke:#ef4444;stroke-opacity:.7;}
      .out{stroke:#22c55e;stroke-opacity:.75;}
      .cap{fill:currentColor;fill-opacity:.72;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;}
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="760" fill="#ffffff"/>

  <text x="460" y="30" text-anchor="middle" font-size="18" class="hdr">Document Processing — Data Architecture</text>

  <rect class="box accent" x="372" y="46" width="176" height="34" rx="17"/>
  <text x="460" y="68" text-anchor="middle" font-size="13" class="lbl">User uploads file</text>
  <line class="flow" x1="460" y1="80" x2="460" y2="98" marker-end="url(#ah)"/>

  <rect class="box accent" x="250" y="98" width="420" height="52" rx="8"/>
  <text x="460" y="120" text-anchor="middle" font-size="13" class="lbl">POST /files · async endpoint</text>
  <text x="460" y="139" text-anchor="middle" font-size="10.5" class="sub">guard: &#8804; 25 MB &#8594; 413  ·  CPU work off the event loop (threadpool)</text>
  <line class="flow" x1="460" y1="150" x2="460" y2="168" marker-end="url(#ah)"/>

  <rect class="box" x="286" y="168" width="348" height="40" rx="8"/>
  <text x="460" y="192" text-anchor="middle" font-size="12.5" class="lbl">extract_text · magic-byte type detection</text>

  <line class="flow" x1="460" y1="208" x2="96" y2="236"/>
  <line class="flow" x1="460" y1="208" x2="242" y2="236"/>
  <line class="flow" x1="460" y1="208" x2="388" y2="236"/>
  <line class="flow" x1="460" y1="208" x2="533" y2="236"/>
  <line class="flow" x1="460" y1="208" x2="678" y2="236"/>
  <line class="flow" x1="460" y1="208" x2="824" y2="236"/>

  <g font-size="11.5">
    <rect class="box" x="30"  y="236" width="133" height="54" rx="6"/>
    <text x="96"  y="260" text-anchor="middle" class="lbl">PDF</text>
    <text x="96"  y="277" text-anchor="middle" font-size="9" class="sub">tables + OCR</text>

    <rect class="box" x="175" y="236" width="133" height="54" rx="6"/>
    <text x="242" y="260" text-anchor="middle" class="lbl">DOCX</text>
    <text x="242" y="277" text-anchor="middle" font-size="9" class="sub">headers·tables·boxes</text>

    <rect class="box" x="320" y="236" width="133" height="54" rx="6"/>
    <text x="388" y="260" text-anchor="middle" class="lbl">PPTX</text>
    <text x="388" y="277" text-anchor="middle" font-size="9" class="sub">slide text·tables</text>

    <rect class="box" x="466" y="236" width="133" height="54" rx="6"/>
    <text x="533" y="260" text-anchor="middle" class="lbl">CSV · XLSX</text>
    <text x="533" y="277" text-anchor="middle" font-size="9" class="sub">&#8804;500 rows·encoding</text>

    <rect class="box" x="611" y="236" width="133" height="54" rx="6"/>
    <text x="678" y="260" text-anchor="middle" class="lbl">TXT</text>
    <text x="678" y="277" text-anchor="middle" font-size="9" class="sub">encoding fallback</text>

    <rect class="box" x="757" y="236" width="133" height="54" rx="6"/>
    <text x="824" y="260" text-anchor="middle" class="lbl">Image</text>
    <text x="824" y="277" text-anchor="middle" font-size="9" class="sub">Tesseract OCR</text>
  </g>

  <line class="flow" x1="96"  y1="290" x2="460" y2="318"/>
  <line class="flow" x1="242" y1="290" x2="460" y2="318"/>
  <line class="flow" x1="388" y1="290" x2="460" y2="318"/>
  <line class="flow" x1="533" y1="290" x2="460" y2="318"/>
  <line class="flow" x1="678" y1="290" x2="460" y2="318"/>
  <line class="flow" x1="824" y1="290" x2="460" y2="318" marker-end="url(#ah)"/>

  <rect class="box guard" x="210" y="318" width="500" height="40" rx="8"/>
  <text x="460" y="342" text-anchor="middle" font-size="12" class="lbl">Normalize · pipe tables · OCR fallback · 200k-char cap</text>
  <line class="flow" x1="460" y1="358" x2="460" y2="376" marker-end="url(#ah)"/>

  <rect class="box guard" x="280" y="376" width="360" height="38" rx="8"/>
  <text x="460" y="399" text-anchor="middle" font-size="12" class="lbl">extraction_insufficient? &#8594; warn + skip</text>
  <line class="flow" x1="460" y1="414" x2="460" y2="432" marker-end="url(#ah)"/>

  <rect class="box accent" x="176" y="432" width="568" height="52" rx="8"/>
  <text x="460" y="454" text-anchor="middle" font-size="12.5" class="lbl">RAG index (per session) · replace / dedup</text>
  <text x="460" y="473" text-anchor="middle" font-size="10.5" class="sub">LightRAG: chunk &#8594; embed (MiniLM) &#8594; entity graph (Groq)</text>
  <line class="flow" x1="460" y1="484" x2="460" y2="502" marker-end="url(#ah)"/>

  <rect class="box accent" x="312" y="502" width="296" height="44" rx="8"/>
  <line class="box accent" x1="312" y1="512" x2="608" y2="512"/>
  <text x="460" y="531" text-anchor="middle" font-size="12" class="lbl">Per-session vector + graph store (disk)</text>

  <line class="flow" x1="460" y1="546" x2="166" y2="576"/>
  <line class="flow" x1="460" y1="546" x2="460" y2="576"/>
  <line class="flow" x1="460" y1="546" x2="753" y2="576" marker-end="url(#ah)"/>

  <g>
    <rect class="box out" x="30"  y="576" width="273" height="46" rx="6"/>
    <text x="166" y="597" text-anchor="middle" font-size="12" class="lbl">/rag/ask</text>
    <text x="166" y="613" text-anchor="middle" font-size="9.5" class="sub">grounded Q&amp;A + citations</text>

    <rect class="box out" x="323" y="576" width="273" height="46" rx="6"/>
    <text x="460" y="597" text-anchor="middle" font-size="12" class="lbl">/metrics</text>
    <text x="460" y="613" text-anchor="middle" font-size="9.5" class="sub">chunked metric extraction</text>

    <rect class="box out" x="616" y="576" width="273" height="46" rx="6"/>
    <text x="753" y="597" text-anchor="middle" font-size="12" class="lbl">/analysis</text>
    <text x="753" y="613" text-anchor="middle" font-size="9.5" class="sub">SLM document scoring</text>
  </g>

  <g font-size="10.5" class="cap">
    <rect class="box accent" x="300" y="656" width="18" height="12" rx="3"/>
    <text x="324" y="666">data flow</text>
    <rect class="box guard" x="392" y="656" width="18" height="12" rx="3"/>
    <text x="416" y="666">guard / cap</text>
    <rect class="box out" x="500" y="656" width="18" height="12" rx="3"/>
    <text x="524" y="666">consumer</text>
  </g>
</svg>
