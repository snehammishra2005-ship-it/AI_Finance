<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" style="color:#1f2937" role="img" aria-label="LightRAG data architecture">
  <title>LightRAG (RAG System) — Data Architecture</title>
  <desc>Ingestion and retrieval paths sharing a per-session vector + graph store.</desc>
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
    <style>
      .box{fill:none;stroke:currentColor;stroke-opacity:.28;}
      .lbl{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:600;}
      .sub{fill:currentColor;fill-opacity:.62;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;}
      .hdr{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:700;}
      .col{fill:currentColor;fill-opacity:.5;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:700;letter-spacing:.08em;}
      .flow{stroke:currentColor;stroke-opacity:.35;fill:none;}
      .accent{stroke:#3b82f6;}
      .guard{stroke:#ef4444;stroke-opacity:.7;}
      .store{stroke:#3b82f6;stroke-opacity:.75;}
      .out{stroke:#22c55e;stroke-opacity:.8;}
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <text x="480" y="26" text-anchor="middle" font-size="18" class="hdr">LightRAG (RAG System) — Data Architecture</text>

  <text x="150" y="52" text-anchor="middle" font-size="11" class="col">INGESTION</text>
  <text x="480" y="52" text-anchor="middle" font-size="11" class="col">PER-SESSION STORE</text>
  <text x="810" y="52" text-anchor="middle" font-size="11" class="col">RETRIEVAL</text>

  <g>
    <rect class="box accent" x="40" y="64" width="220" height="30" rx="15"/>
    <text x="150" y="83" text-anchor="middle" font-size="11.5" class="lbl">Extracted document text</text>
    <rect class="box" x="40" y="110" width="220" height="34" rx="7"/>
    <text x="150" y="131" text-anchor="middle" font-size="11.5" class="lbl">ingest_document()</text>
    <rect class="box" x="40" y="160" width="220" height="34" rx="7"/>
    <text x="150" y="177" text-anchor="middle" font-size="11" class="lbl">Replace same-name</text>
    <text x="150" y="189" text-anchor="middle" font-size="8.5" class="sub">skip content duplicate</text>
    <rect class="box" x="40" y="210" width="220" height="34" rx="7"/>
    <text x="150" y="231" text-anchor="middle" font-size="11.5" class="lbl">ainsert · chunk (tokens)</text>
    <rect class="box" x="40" y="260" width="220" height="34" rx="7"/>
    <text x="150" y="277" text-anchor="middle" font-size="11" class="lbl">Embed · MiniLM</text>
    <text x="150" y="289" text-anchor="middle" font-size="8.5" class="sub">384-d, normalized</text>
    <rect class="box" x="40" y="310" width="220" height="34" rx="7"/>
    <text x="150" y="327" text-anchor="middle" font-size="11" class="lbl">Entity + relation extract</text>
    <text x="150" y="339" text-anchor="middle" font-size="8.5" class="sub">Groq llama-3.1-8b-instant</text>
  </g>
  <line class="flow" x1="150" y1="94"  x2="150" y2="110" marker-end="url(#ra)"/>
  <line class="flow" x1="150" y1="144" x2="150" y2="160" marker-end="url(#ra)"/>
  <line class="flow" x1="150" y1="194" x2="150" y2="210" marker-end="url(#ra)"/>
  <line class="flow" x1="150" y1="244" x2="150" y2="260" marker-end="url(#ra)"/>
  <line class="flow" x1="150" y1="294" x2="150" y2="310" marker-end="url(#ra)"/>

  <g>
    <rect class="box store" x="395" y="150" width="170" height="46" rx="8"/>
    <line class="store" x1="395" y1="160" x2="565" y2="160"/>
    <text x="480" y="172" text-anchor="middle" font-size="11.5" class="lbl">Vector store</text>
    <text x="480" y="187" text-anchor="middle" font-size="9" class="sub">nano-vectordb</text>
    <rect class="box store" x="395" y="212" width="170" height="46" rx="8"/>
    <line class="store" x1="395" y1="222" x2="565" y2="222"/>
    <text x="480" y="234" text-anchor="middle" font-size="11.5" class="lbl">Knowledge graph</text>
    <text x="480" y="249" text-anchor="middle" font-size="9" class="sub">NetworkX</text>
    <rect class="box store" x="395" y="274" width="170" height="46" rx="8"/>
    <line class="store" x1="395" y1="284" x2="565" y2="284"/>
    <text x="480" y="286" text-anchor="middle" font-size="11.5" class="lbl">Doc-status KV</text>
    <text x="480" y="305" text-anchor="middle" font-size="9" class="sub">indexed / failed / dup</text>
  </g>
  <line class="flow" x1="260" y1="277" x2="395" y2="180" marker-end="url(#ra)"/>
  <line class="flow" x1="260" y1="327" x2="395" y2="240" marker-end="url(#ra)"/>
  <line class="flow" x1="260" y1="227" x2="395" y2="300" marker-end="url(#ra)"/>

  <g>
    <rect class="box accent" x="660" y="64" width="240" height="30" rx="15"/>
    <text x="780" y="83" text-anchor="middle" font-size="11.5" class="lbl">User question</text>
    <rect class="box" x="660" y="110" width="240" height="30" rx="7"/>
    <text x="780" y="130" text-anchor="middle" font-size="11.5" class="lbl">POST /rag/ask</text>
    <rect class="box guard" x="660" y="156" width="240" height="34" rx="7"/>
    <text x="780" y="173" text-anchor="middle" font-size="11" class="lbl">session has documents?</text>
    <text x="780" y="185" text-anchor="middle" font-size="8.5" class="sub">else: prompt to upload</text>
    <rect class="box" x="660" y="212" width="240" height="34" rx="7"/>
    <text x="780" y="229" text-anchor="middle" font-size="11.5" class="lbl">aquery · mode = mix</text>
    <text x="780" y="241" text-anchor="middle" font-size="8.5" class="sub">vector + graph</text>
    <rect class="box" x="660" y="262" width="240" height="34" rx="7"/>
    <text x="780" y="279" text-anchor="middle" font-size="11" class="lbl">Synthesis + citations</text>
    <text x="780" y="291" text-anchor="middle" font-size="8.5" class="sub">Groq</text>
    <rect class="box" x="660" y="312" width="240" height="30" rx="7"/>
    <text x="780" y="332" text-anchor="middle" font-size="10.5" class="lbl">Strip [no-context] sentinel</text>
    <rect class="box out" x="660" y="358" width="240" height="32" rx="16"/>
    <text x="780" y="378" text-anchor="middle" font-size="11.5" class="lbl">Grounded answer + sources</text>
  </g>
  <line class="flow" x1="780" y1="94"  x2="780" y2="110" marker-end="url(#ra)"/>
  <line class="flow" x1="780" y1="140" x2="780" y2="156" marker-end="url(#ra)"/>
  <line class="flow" x1="780" y1="190" x2="780" y2="212" marker-end="url(#ra)"/>
  <line class="flow" x1="780" y1="246" x2="780" y2="262" marker-end="url(#ra)"/>
  <line class="flow" x1="780" y1="296" x2="780" y2="312" marker-end="url(#ra)"/>
  <line class="flow" x1="780" y1="342" x2="780" y2="358" marker-end="url(#ra)"/>

  <line class="flow" x1="565" y1="173" x2="660" y2="222" marker-end="url(#ra)"/>
  <line class="flow" x1="565" y1="235" x2="660" y2="228" marker-end="url(#ra)"/>
  <line class="flow" x1="565" y1="297" x2="660" y2="173" marker-end="url(#ra)"/>

  <rect class="box" x="40" y="418" width="880" height="40" rx="8"/>
  <text x="480" y="435" text-anchor="middle" font-size="11.5" class="lbl">RAGServiceManager — per-session isolation (workspace = session_id)</text>
  <text x="480" y="450" text-anchor="middle" font-size="9.5" class="sub">in-memory LRU (32 sessions)  ·  disk sweep (7-day TTL)  ·  /rag/reprocess retries FAILED / PENDING docs</text>

  <g font-size="10" class="sub">
    <rect class="box accent" x="300" y="482" width="16" height="11" rx="3"/>
    <text x="322" y="491">flow</text>
    <rect class="box guard" x="372" y="482" width="16" height="11" rx="3"/>
    <text x="394" y="491">guard</text>
    <rect class="box store" x="452" y="482" width="16" height="11" rx="3"/>
    <text x="474" y="491">store</text>
    <rect class="box out" x="524" y="482" width="16" height="11" rx="3"/>
    <text x="546" y="491">answer</text>
  </g>
</svg>
