<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" style="color:#1f2937" role="img" aria-label="RAG implementation data flow diagram">
  <title>RAG Implementation — Data Flow Diagram</title>
  <defs>
    <marker id="rd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
    <style>
      .lbl{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:600;}
      .sub{fill:currentColor;fill-opacity:.6;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;}
      .hdr{fill:currentColor;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-weight:700;}
      .flow{stroke:currentColor;stroke-opacity:.4;fill:none;}
      .fl{fill:currentColor;fill-opacity:.68;font-family:ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;font-size:8.5px;}
      .entity{fill:none;stroke:#2563eb;stroke-opacity:.85;}
      .proc{fill:none;stroke:currentColor;stroke-opacity:.35;}
      .ext{fill:none;stroke:#5b6b7f;stroke-opacity:.7;}
      .store{stroke:#1e8449;stroke-opacity:.85;}
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" class="hdr">RAG Implementation — Data Flow Diagram</text>

  <text x="60" y="70" font-size="10" class="sub" font-weight="700" letter-spacing="0.08em">INGEST</text>
  <text x="60" y="360" font-size="10" class="sub" font-weight="700" letter-spacing="0.08em">QUERY</text>

  <rect class="entity" x="24" y="180" width="104" height="120" rx="4"/>
  <text x="76" y="244" text-anchor="middle" font-size="12" class="lbl">User</text>

  <!-- INGEST -->
  <rect class="proc" x="176" y="96" width="110" height="46" rx="12"/>
  <text x="231" y="116" text-anchor="middle" font-size="10.5" class="lbl">/files</text>
  <text x="231" y="130" text-anchor="middle" font-size="8" class="sub">extract · cap</text>

  <rect class="proc" x="330" y="90" width="160" height="58" rx="12"/>
  <text x="410" y="114" text-anchor="middle" font-size="10.5" class="lbl">RAG ingest</text>
  <text x="410" y="128" text-anchor="middle" font-size="8" class="sub">LightRAG · replace/dedup</text>

  <rect class="ext" x="330" y="178" width="100" height="34" rx="6"/>
  <text x="380" y="195" text-anchor="middle" font-size="9" class="lbl">bge-small</text>
  <text x="380" y="206" text-anchor="middle" font-size="7.5" class="sub">embeddings (local)</text>

  <rect class="ext" x="450" y="178" width="120" height="40" rx="6"/>
  <text x="510" y="195" text-anchor="middle" font-size="9.5" class="lbl">Groq API</text>
  <text x="510" y="208" text-anchor="middle" font-size="7.5" class="sub">graph + synthesis</text>

  <line class="store" x1="640" y1="92" x2="800" y2="92"/>
  <line class="store" x1="640" y1="150" x2="800" y2="150"/>
  <line class="store" x1="640" y1="92" x2="640" y2="150"/>
  <text x="720" y="114" text-anchor="middle" font-size="10" class="lbl">Per-session store</text>
  <text x="720" y="128" text-anchor="middle" font-size="8" class="sub">vector · graph · doc-status</text>

  <line class="flow" x1="128" y1="205" x2="176" y2="125" marker-end="url(#rd)"/>
  <text x="118" y="172" class="fl">document</text>
  <line class="flow" x1="286" y1="119" x2="330" y2="119" marker-end="url(#rd)"/>
  <text x="290" y="112" class="fl">text</text>
  <line class="flow" x1="400" y1="148" x2="385" y2="178" marker-start="url(#rd)" marker-end="url(#rd)"/>
  <text x="356" y="168" class="fl">chunks/vecs</text>
  <line class="flow" x1="450" y1="148" x2="500" y2="178" marker-end="url(#rd)"/>
  <text x="452" y="168" class="fl">entities</text>
  <line class="flow" x1="490" y1="119" x2="640" y2="119" marker-end="url(#rd)"/>
  <text x="530" y="112" class="fl">vectors + graph</text>

  <!-- QUERY -->
  <rect class="proc" x="330" y="384" width="150" height="56" rx="12"/>
  <text x="405" y="408" text-anchor="middle" font-size="10.5" class="lbl">/rag/ask</text>
  <text x="405" y="422" text-anchor="middle" font-size="8" class="sub">hybrid (mix) query</text>

  <line class="flow" x1="128" y1="270" x2="330" y2="405" marker-end="url(#rd)"/>
  <text x="150" y="360" class="fl">question</text>
  <path class="flow" d="M330 428 L150 428 L150 300" marker-end="url(#rd)"/>
  <text x="176" y="422" class="fl">cited answer</text>
  <path class="flow" d="M720 150 L720 412 L480 412" marker-end="url(#rd)"/>
  <text x="560" y="406" class="fl">retrieved context</text>
  <path class="flow" d="M480 396 L510 396 L510 218" marker-start="url(#rd)" marker-end="url(#rd)"/>
  <text x="516" y="300" class="fl">context+q / answer</text>

  <g font-size="10" class="sub">
    <rect class="entity" x="40" y="474" width="16" height="12" rx="2"/>
    <text x="62" y="484">user</text>
    <rect class="proc" x="120" y="474" width="16" height="12" rx="6"/>
    <text x="142" y="484">process</text>
    <rect class="ext" x="220" y="474" width="16" height="12" rx="3"/>
    <text x="242" y="484">external service</text>
    <line class="store" x1="360" y1="474" x2="376" y2="474"/>
    <line class="store" x1="360" y1="486" x2="376" y2="486"/>
    <line class="store" x1="360" y1="474" x2="360" y2="486"/>
    <text x="382" y="484">data store</text>
  </g>
</svg>
