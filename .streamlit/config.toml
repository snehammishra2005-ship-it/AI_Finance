[server]
enableCORS = false
enableXsrfProtection = false
maxMessageSize = 500

# "Carbon amber" dark theme. Pin Streamlit to dark with matching colors so its
# own chrome (header, dropdown menus, the attach popover, checkboxes) matches
# the dark surfaces set in ui/styles.py.
[theme]
base = "dark"
primaryColor = "#f59e0b"
backgroundColor = "#17130d"
secondaryBackgroundColor = "#221b11"
textColor = "#efe7db"
font = "sans serif"
