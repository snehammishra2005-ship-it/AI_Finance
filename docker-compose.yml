services:
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    # No published ports: the backend is reachable ONLY on the internal
    # ai-finance-net network (by the frontend), never directly from the host.
    # Publishing :8000 previously exposed a second, unauthenticated door — this
    # removes it (see production-readiness P0 #4).
    expose:
      - "8000"
    volumes:
      - .:/app
      # Persist the HuggingFace cache so the embedding model
      # (BAAI/bge-small-en-v1.5, ~90MB) is downloaded once, not on every rebuild.
      - hf-cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - HF_HOME=/root/.cache/huggingface
      # Structured data store. Empty (dev) -> the app falls back to local SQLite.
      # In production set DATABASE_URL in .env to the Postgres service, e.g.
      #   DATABASE_URL=postgresql+psycopg://aifinance:PASSWORD@db:5432/aifinance
      - DATABASE_URL=${DATABASE_URL:-}
    healthcheck:
      # python instead of curl: curl isn't in the python:slim base image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      # Generous grace period: the first start downloads the embedding model
      # and imports torch, which can take a couple of minutes.
      start_period: 180s
    networks:
      - ai-finance-net

  frontend:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    # Bind to the host's loopback only (not 0.0.0.0): reachable at
    # http://localhost:8501 for local development, but NOT exposed on the
    # machine's public network interfaces. In production the Caddy proxy below
    # is the only public entry point and reaches the frontend over the internal
    # network, so real traffic is always TLS-terminated.
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - BACKEND_HOST=backend
      - BACKEND_API_URL=http://backend:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        # Wait until the backend is actually serving (not merely started), so
        # the UI never opens onto a "backend didn't start in time" error.
        condition: service_healthy
    networks:
      - ai-finance-net

  # Reverse proxy with automatic HTTPS. Enabled only under the "production"
  # profile, so a plain `docker compose up` stays a simple local dev setup:
  #     DOMAIN=your.domain docker compose --profile production up -d --build
  # Caddy is the ONLY service that publishes public ports (80/443); it terminates
  # TLS and forwards to the frontend over the internal network. See ./Caddyfile.
  caddy:
    image: caddy:2
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - ai-finance-net

  # Postgres for structured data (users, chat history) in production. Enabled
  # under the "production" profile only — local dev uses SQLite with no DB
  # service. Point the backend at it by setting DATABASE_URL in .env to
  #   postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  db:
    image: postgres:16
    profiles: ["production"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aifinance}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-in-env}
      - POSTGRES_DB=${POSTGRES_DB:-aifinance}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aifinance}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-finance-net

volumes:
  hf-cache:
  caddy-data:
  caddy-config:
  pg-data:

networks:
  ai-finance-net:
    driver: bridge
